# 分类/标签自定义字段（inc/category.php 后台分类字段的转写，
# 对应 category.php / tag.php 中 get_term_meta 读取的
# vt_full_width / vt_list_type / vt-thumbnail / full_width）
# 按分类名（或标签名）映射：
# term_meta:
#   技术分享:
#     vt_full_width: 0        # 0 跟随系统 / 1 强制全宽
#     vt_list_type: 0         # 0 列表 / 1 卡片（卡片列数取 vt_columns）
#     vt-thumbnail: /images/banner.jpg
# ------------------------------------------------------------
term_meta: {}

# 评论层级深度（WP: get_option('thread_comments_depth', 3)）
thread_comments_depth: 3

# ------------------------------------------------------------
# 评论系统 Comment system
#
# 主题原生的评论表单是从 WP 转写的空壳：没有后端，提交不会保存。
# 接入 twikoo 后，文章页评论区整体替换为 twikoo（原生 DOM 不再输出）。
# 自建 twikoo 的 env_id 直接填服务地址（末尾不要带斜杠）；
# 腾讯云开发环境则填环境 ID（如 xxx-1a2b3c），并改用 twikoo.all.min.js。
# ------------------------------------------------------------
comment_provider: "twikoo"           # twikoo = 接入 twikoo；native = 主题原生空表单
twikoo:
  enable: true
  env_id: "https://twikoo.liublog.cn"
  lang: "zh-CN"                      # 评论区语言
  js: "/lib/twikoo/twikoo.min.js"    # 本地化的前端库（版本与服务端 1.6.44 对齐）
  path: ""                           # 评论标识；留空用 location.pathname（每篇文章唯一即可）
  visitor: false                     # 是否用 twikoo 做阅读量统计（会额外请求）

# ------------------------------------------------------------
# 点赞 like（zan）
#
# 写法和上面的 twikoo 一致：enable 总开关，server 填服务地址（末尾不带斜杠），
# js 是前端库地址，path 留空用 location.pathname。
# 打开后，文章页那个「喜欢」按钮交给 zan：数字从服务端取，同一访客只算一次。
# once 是多出来的那一个字段 —— 单次点击：
#   true  点过就锁住，按钮不再响应；
#   false 允许重复点击，但服务端仍按访客去重，数字不会重复增加。
#
# 阅读数不在这里配，它在下面 post_views 节：provider 选 zan，
# 地址填同一个 server，读数和点赞共用一套服务、一个访客标识。
# ------------------------------------------------------------
zan:
  enable: true
  server: "https://zan.liublog.cn"
  js: "https://zan.liublog.cn/api/js/zan.js?v=2.0.6"   # 服务端升级后改这个版本号，绕开浏览器 12 小时缓存
  path: ""
  once: true

