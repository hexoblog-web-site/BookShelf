# ------------------------------------------------------------
# 站长名片  Author card
# 模板：layout/_partial/widgets/user-widget.ejs
# 样式：source/style/user-card.css
#
# 沿用原版主题 layout/_widget/user-card.ejs 的 card-info 结构
# （widget.css 中注明「参考南方嘉木布局」）：背景图铺顶、头像左跨、
# 昵称压在背景图上、三项统计横排、底部两个按钮 48% 分栏。
#
# 与 WP 版 UserWidget 的区别：原版输出「文章/评论/喜欢」三个数字，
# 后两个依赖 WP 数据库（wp_comments、wp_vt_star），静态站恒为 0，
# 会显示两个刺眼的 0。这里换成站内真实存在的 文章 / 标签 / 分类。
#
# ===== 可改参数一览 =====
#   enable         开关，false 则整张卡片不输出
#   avatar         头像路径（圆形裁切，建议正方形图 ≥ 160×160）
#   nickname       昵称；留空 -> 站点 _config.yml 的 author
#   description    一句话签名；留空 -> 站点 _config.yml 的 subtitle
#   background     顶部背景图；留空 -> 不铺背景，卡片变纯色
#   badge          头像右下角认证徽章开关
#   certification  徽章图片；留空 -> 用内置的蓝色对勾（矢量，无图）
#   social         右上角竖排三点 + 社交图标开关
#   social_items   右上角那组图标的列表：title / icon / link（改地址就改这里）
#                  整段留空 -> 回退用 sns_items，和页脚共用同一份
#   buttons        底部按钮数组：icon / text / link / target
#
# 不可配置的部分：中间的「N 文章 / N 标签 / N 分类」三项目前是自动统计
# 站内数量，写死不动；要改成别的字段需改模板。
# ------------------------------------------------------------
user_card:
  enable: true                       # true 显示 / false 隐藏整张卡片
  avatar: "/images/avatar.jpg"       # 头像，圆形裁切；建议正方形，160×160 以上
  nickname: ""                       # 昵称；留空取站点 author（当前：老刘博客）
  description: ""                    # 一句话签名；留空取站点 subtitle
  background: "/images/user-card-bg.webp"  # 顶部背景图（95px 高，object-fit: cover）；留空则不铺，卡片改纯色底
  badge: true                        # 头像右下角认证徽章：true 显示 / false 不显示
  certification: ""                  # 徽章图片路径；留空则用内置蓝色对勾（不用准备图片）
  social: true                       # 右上角竖排三点 + 点开后的社交图标；false 则连按钮一起不输出
  social_items:                      # 卡片专属的社交图标（想改地址就改这里，页脚不受影响）
    # 三项都必填：title = 悬停提示与无障碍标签；icon = Font Awesome 类名；link = 跳转地址
    # 想删掉某个图标：把它的三行整段删掉即可，卡片宽度会自动收
    # 想加一个：照抄一段改内容即可，建议别超过 5 个（侧栏窄，6 个会挤到头像）
    #
    # 常用品牌图标（fab 开头，主题自带 Font Awesome 6.7.2 Free 已有）：
    #   fab fa-github          GitHub            fab fa-git-alt       Gitee
    #   fab fa-bilibili        B 站              fab fa-weibo         微博
    #   fab fa-qq              QQ                fab fa-weixin        微信
    #   fab fa-steam           Steam             fab fa-tiktok        抖音
    #   fab fa-x-twitter       X（推特）         fab fa-telegram       Telegram
    #   fab fa-youtube         YouTube           fab fa-zhihu          知乎
    # 邮件用 fas fa-envelope，地址写 mailto:you@example.com
    #
    # ★ 整段（连同 social_items: 这一行）全部删掉或留空，则自动回退用
    #   上面「SNS 链接」那一节的 sns_items —— 也就是和页脚共用同一份配置。
    - title: "Gitee"
      icon: "fab fa-git-alt"
      link: "https://gitee.com/"
    - title: "Github"
      icon: "fab fa-github"
      link: "https://github.com/"
    - title: "抖音"
      icon: "fab fa-tiktok"
      link: "https://douyin.com/"
    - title: "Bilibili"
      icon: "fab fa-bilibili"
      link: "https://bilibili.com/"
    - title: "Weibo"
      icon: "fab fa-weibo"
      link: "https://weibo.com/"
  buttons:                           # 底部按钮，建议正好 2 个（第 1 个实心主色 / 其余描边）
    # icon   Font Awesome 类名：fas = 实心图标，fab = 品牌图标，不填只显示文字
    # text   按钮文字
    # link   站内路径（如 /links/）或完整外链，自动判断
    # target 可选，外链建议 "_blank"，模板会给它补 rel="noopener"
    - icon: "fas fa-rss"
      text: "订阅"
      link: "/atom.xml"
      target: "_blank"
    - icon: "fas fa-link"
      text: "友链"
      link: "/links/"

# ------------------------------------------------------------
# 文章页侧栏目录 TOC（Hexo 版新增）
# 目录以卡片形式吸在文章页右侧栏顶部；条目多时卡片内部滚动。
# 单篇文章要关掉目录，在 front-matter 写 show_table: false 即可。
# ------------------------------------------------------------
toc_enable: true                       # 是否显示文章页侧栏目录
toc_rows: 3                            # 静止时显示几条（超出的部分在卡片内滚动）
toc_rows_hover: 6                      # 鼠标滑过 / 键盘聚焦时展开到几条

# ============================================================
# 板块统一配置  Sections
# （Hexo 版新增：原 WP 主题这些标题/图标/条数是后台固定值或散在
#   各处，此处集中到一个块里管理；旧写法 hot_title / tags_num 等
#   扁平字段仍然有效，模板与旧配置都无需改动）
#
# 每项可用字段：
#   show        true  = 显示该板块
#               false = 关闭（全站隐藏，首页第 1 页也不输出）
#   paged_hide  true  = 仅在首页第 1 页显示（/page/2/ 起隐藏）
#               false = 每页都显示
#   title       板块标题
#   icon        FontAwesome 图标类名（如 fa-solid fa-fire；留空只显示文字）
#   num         调用条数（0 = 不限制 / 显示全部）
#
# ★ 首页板块的显示顺序 = 下面 5 个首页板块的书写顺序，
#   想换位置把整段移到别处即可。
# ============================================================
sections:

  # ---------------- 首页板块（顺序即显示顺序）----------------
  slider:                            # 幻灯片 + 幻灯片右侧两个推荐位
    show: true
    paged_hide: true
  guide:                             # 精选导读（三列图文索引），开关见 guide_box
    show: true
    paged_hide: true
  notices:                           # 顶部公告栏（铃铛 + 滚动公告）
    show: true
    paged_hide: true
  hot:                               # 图文推荐（对应 WP hot_title）
    show: true
    paged_hide: true
    title: "图文推荐"
    icon: "fa-solid fa-fire"
    num: 5
  last:                              # 文章列表（含分页）—— 建议保持 true
    show: true
    paged_hide: false
  links:                             # 友情链接（对应 WP links_title）
    show: true
    paged_hide: false
    title: "友情链接"
    icon: "fa-solid fa-link"

  # ---------------- 侧栏小工具 ----------------
  # 侧栏显示哪几个由 _config.yml 的 sidebar 数组决定（增删条目），
  # 这里的 show 是「临时开关」：写 false 就隐藏，不用改 sidebar 数组。
  #   popular → hot-list（热门文章）
  #   recent  → image-article-list（最新文章）
  #   tags    → tags-widget（文章标签）
  #   category→ category-list（文章分类）
  popular:                           # [Mirage] 热门
    show: true
    title: "热门文章"
    icon: "fa-solid fa-ranking-star"
    num: 5
  recent:                            # [Mirage] 最新文章
    show: true
    title: "最新文章"
    icon: "fa-solid fa-clock-rotate-left"
    num: 5
  tags:                              # [Mirage] 标签
    show: true
    title: "文章标签"
    icon: "fa-solid fa-tags"
    num: 6
  category:                          # [Mirage] 文章分类列表
    show: true
    title: "文章分类"
    icon: "fa-solid fa-folder-tree"
    num: 0

# ============================================================
# SEO 设置（集中配置）
#
# 对应 WP：inc/config.php「SEO设置」+ templates/seo.php
# Hexo 没有 WP 的 term meta，分类/标签的说明无处存放，
# 因此统一放在这里，按名字对应到具体分类/标签页。
#
# 各页面实际使用哪一份数据：
#   首页      → 本块 keywords / description（留空则自动取站点 _config.yml）
#   分类页    → 下面 categories 里同名分类的配置
#                （没列出的分类 → 自动生成“XX分类下的全部文章，共 N 篇”）
#   标签页    → 下面 tags 里同名标签的配置
#                （没列出的标签 → 自动生成“XX标签相关的全部文章，共 N 篇”）
#   文章页    → 文章开头 front-matter 的 description / keywords
#                （没写 → 取手动摘要 → 再没有就从正文自动提取）
#   普通页面  → 页面 front-matter 的 description / keywords
#   归档页    → 自动生成年月描述
#
# ★ 新增了分类想单独写介绍：在 categories 下照着加一段即可（键 = 分类名）。
# ★ 不想维护：把 auto_generate 保持 true，未配置的分类自动有一句话。
# ============================================================
seo:
  # ---------------- 站点级（首页使用） ----------------
  keywords: ""                    # 留空 = 自动用站点 _config.yml 的 keywords
  description: ""                 # 留空 = 自动用站点 _config.yml 的 description

  auto_generate: true             # true = 未单独配置的分类/标签/归档自动生成描述
  post_use_taxonomy: true         # true = 文章关键词额外纳入标签与分类（false = 只用 front-matter）

  # ---------------- 分类页（键 = 分类名） ----------------
  # 目前站内共 6 个分类，已按各分类下的实际文章内容填写。
  categories:
    民俗传说:                      # 20 篇
      keywords: "民俗传说,传统节日,春节习俗,七夕传说,中秋节,民间习俗,年俗由来"
      description: "民俗传说分类收录中国传统节日的由来与民间习俗，包括年兽与春节、牛郎织女与七夕、中秋嫦娥等经典传说，讲清每个节日背后真正的文化来历。"

    志怪传说:                      # 9 篇
      keywords: "志怪传说,山海经,聊斋志异,妖怪故事,民间怪谈,狐鬼花妖"
      description: "志怪传说分类整理《山海经》《聊斋志异》等古籍中的妖怪神异故事与民间怪谈，讲述狐鬼花妖、奇闻异事背后的隐喻与民间信仰。"

    俗语俚语:                      # 9 篇
      keywords: "俗语俚语,民间谚语,歇后语,老话由来,俗语故事"
      description: "俗语俚语分类讲述民间老话、谚语和歇后语的出处与故事，解释每句话是怎么来的、原本是什么意思，看懂中国人日常口语里的智慧与讲究。"

    民间故事:                      # 7 篇
      keywords: "民间故事,民间传说,中国故事,寓言故事,乡土故事"
      description: "民间故事分类收录口耳相传的民间传说与寓言故事，人物鲜活、情节曲折，记录乡土社会里流传最广的善恶因果与处世道理。"

    国学经典:                      # 7 篇
      keywords: "国学经典,论语,孔子,古文名句,传统文化,诸子百家"
      description: "国学经典分类分享《论语》等传统典籍的原文与解读，摘录孔子及诸子的名言金句，用通俗易懂的方式讲述其中的修身与处世之道。"

    稗官野史:                      # 历史人物轶事
      keywords: "稗官野史,历史人物轶事,名人趣事,野史笔记,正史与野史,古人逸闻"
      description: "稗官野史分类收录历代笔记与民间流传的历史人物轶事，讲名人的怪癖、机智与翻车现场，并逐条对照正史辨别真假，看故事也看门道。"

    随笔杂记:                      # 1 篇
      keywords: "随笔杂记,生活随笔,个人记录,读书笔记"
      description: "随笔杂记分类记录站长的日常思考与零散笔记，内容随性，多为生活观察、读书所得和写作心得。"

  # ---------------- 标签页（键 = 标签名，可选） ----------------
  # 未列出的标签会按 auto_generate 自动生成描述；需要单独写的照着下面加：
  tags: {}
  #  tags:
  #    Manim:
  #      keywords: "Manim,数学动画,Python 动画"
  #      description: "Manim 标签下的全部文章，记录用 Python 制作数学动画的实践与踩坑。"

# ============================================================
# 自定义代码注入  Inject
#
# 作用：往全站每一个页面（首页/文章/独立页/分类/标签/归档/404）
#      的 </head> 之前、</body> 之前插入自定义代码。
#
# 写法：
#   - 每一条是一个 YAML 列表项，内容原样输出、不转义，可写任意 HTML
#   - 一个元素里可以写多行（用 YAML 的 | 块或直接一行写完）
#   - 路径一律写绝对路径（以 / 开头），指向主题或站点 source 下的文件，
#     例如 source/style/custom.css -> /style/custom.css
#   - 临时停用某条：在该行前加 # 注释掉，不必删除
#   - 改完执行 npx hexo generate 生效；hexo s 会自动重建
#
# 建议分工：
#   head   —— 样式表、字体、meta、统计脚本（此时 DOM 还没有，不能选元素）
#   bottom —— 操作页面的脚本、埋点（DOM 已就绪，脚本可直接跑）
# ============================================================
inject:
  # 插入到 </head> 之前
  head:
    # 自定义 css。media=defer + onload 是异步加载写法，不阻塞首屏；
    # 需要样式立刻生效就用下面这条普通写法（二选一，另一条注释掉）
    # - <link rel="stylesheet" href="/style/custom.css" media="defer" onload="this.media='all'">
    - <link rel="stylesheet" href="/style/custom.css">

  # 插入到 </body> 之前
  bottom:
    # 自定义 js
    # - <script src="/js/xxx.js"></script>
    - <script src="/js/flink.js"></script>
