# 模板 layout/about.ejs ｜ 样式 source/style/about-page.css
#
# 页面结构（自上而下）：
#   标题栏 → 个人名片（头像 + 四角浮签）→ 关于我 →
#   站内怎么逛（六个栏目内链）→ 十年之约 → 建站历程 → 站点数据 + 关于读者 →
#   联系与足迹 → 回到顶部按钮
#
# 页面内容（文案、时间起点、SEO 摘要）全部在 source/_data/about.yml，
# 平时只改那一个文件，这里只留总开关。
#
# 附带：layout/_partial/about-head.ejs 输出 canonical / og / JSON-LD，
#       分享图 themes/bookshelf/source/images/about-og.jpg（1200×630）
#       公众号版导出：node tools/about-to-wechat.js → working/about-wechat.html

# 参数：
#   enable     页面总开关，false 时显示提示文字而不是 404
about:
  enable: true

