# ============================================================
# BookShelf（书架）Hexo Theme Config
#
# 一款优雅的 Hexo 文学阅读博客主题。
# 主题前身为 Mirage（vtheme.cn）的 Hexo 转写版 v3.12.0，本仓库更名
# BookShelf 后继续维护：页面结构与配置项沿用原设计，阅读体验相关
# 的增强集中写在 source/js/bookshelf-extra.js、source/style/bookshelf-extra.css。
#
# 本文件是 WordPress 主题 inc/config.php（Codestar Framework 后台设置项）
# 的 1:1 转写。所有字段 ID（key）与 WordPress 版完全一致，
# 模板（EJS）中通过 vt_get_config(key, default) 读取，
# 与 WP 模板中 vt_get_config() 的调用一一对应。
#
# ★ 日常要改的板块开关 / 标题 / 图标 / 条数，全部集中在文件末尾的
#   「板块统一配置 sections」一个块里，不必在下面逐段查找。
#
# @author  vtheme <mail@vtheme.cn>
# @link    https://www.liublog.cn
# ============================================================

# ------------------------------------------------------------
# 常规设置  General settings
# （inc/config.php 第一节）
# ------------------------------------------------------------
basic_style: "#f45d1d"              # 主题色调 Theme color tone（default '#007aff'）
page_data_type: "0"                 # 显示页面参数 Display page parameters（0 隐藏 / 1 显示 / 2 console.log）
dark_mode_type: "1"                 # 暗黑模式 Dark mode（1 开启 / 0 关闭 / 2 跟随系统）
default_image: "/images/default.jpg"   # 默认图片 Default Image（列表卡片无封面时的占位，16:9）
share_image: "/images/share-card.jpg"  # 分享卡 Social Share Card（og:image 兜底，1200×630）
background_image: ""                # 背景图片 Background image
lazy_load_enabled: true             # 懒加载 Lazy Loading（false = 卡片图直接输出真实 src，不等脚本）

# ------------------------------------------------------------
# SEO 设置  SEO settings
# （inc/config.php 第二节）
# ------------------------------------------------------------
keywords: ""                        # 关键字 Keywords（已废弃 → seo.keywords）
description: ""                     # 描述 Description（已废弃 → seo.description）

# ------------------------------------------------------------
# 首页设置 - 布局设置  Home page settings / Layout setting
# （inc/config.php home_layout，sorter 控件：
#   WP 中 enabled/disabled 两个容器，此处用数组顺序表示显示顺序）
# 白名单与 index.php 一致：hot / last / links / notices / slider
# 说明：
#   显示顺序 = 这里的顺序（没列出的板块按 sections 的书写顺序排在后面）
#   显示开关 = sections.<板块>.show
#   —— 改动这里立刻反映到首页；漏写一个板块也不会让它消失，
#      只是排到最后，想隐藏请用 sections 的 show。
# ------------------------------------------------------------
home_layout:
  enabled:
    - slider                        # Sliders 幻灯片
    - guide                         # 精选导读（guide_box）
    - notices                       # Notices 通知公告
    - hot                           # Hot topics 热门文章
    - last                          # Latest 最新文章
    - links                         # Links 友情链接
  disabled: []

# ------------------------------------------------------------
# 首页设置 - 幻灯片模块  Sliders
# （inc/config.php 第三节；slider.php 中读取 slider_height 默认 300）
# ------------------------------------------------------------
slider_height: 300                  # 幻灯片高度（slider.php: vt_get_config('slider_height', 300)）
slider_autoplay: true               # 自动播放 true=5 秒一张 / false=不自动播 / 填数字=毫秒（如 8000）
slider_effect: "slide"              # 切换效果 Slider Effects（slide/fade/cube/coverflow/flip/cards/creative）
slider_items:                       # 幻灯片列表 Slide list（group 控件）
  - title: "年兽的传说：春节的由来"   # 标题 Title
    image: "/upload/allimg/2026/0730/20260730_01.jpg"
    target: false                   # 新窗口打开链接 New window opens link
    link: "/articles/3ccc38b7.html" # 链接地址 Link address
  - title: "值得品读的孔子的三十句金句名言"
    image: "/upload/allimg/2026/0814/20260814_03.jpg"
    target: false
    link: "/articles/c7cd0c3d.html"
  - title: "木匠手里无废料的故事"
    image: "/upload/allimg/2026/0711/20260711_01.jpg"
    target: false
    link: "/articles/4a17b156.html"
top_items:                          # 推荐 Recommendation（group 控件，slider.php 只取前 2 项）
  - title: "牛郎织女：七夕的传说"
    image: "/upload/allimg/2026/0728/20260728_03.jpg"
    target: false
    link: "/articles/e408726b.html"
  - title: "老鼠嫁女：正月里那场没有新郎的喜事"
    image: "/upload/allimg/2026/0817/20260817_01.jpg"
    target: false
    link: "/articles/3f8a21c7.html"
# ------------------------------------------------------------
# 首页设置 - 通知公告  Notices
# （inc/config.php 通知公告节）
# ------------------------------------------------------------
notice_target: false                # 新窗口打开链接 New window opens link
notice_items:                       # 通知列表（group 控件）
  - title: "通知公告 1"             # 标题 Title
    link: "/#1"                     # 链接 Links
  - title: "通知公告 2"
    link: "/#2"
  - title: "通知公告 3"
    link: "/#3"

# ------------------------------------------------------------
# 首页设置 - 精选导读  Featured guide
# 版式：三列图文索引（分类胶囊 / 日期 / 单行标题 / 两行摘要），
# 首页板块顺序见文件末尾 sections.guide（顺序即显示位置）。
#
# 数据源（按优先级）：
#   1. 站点数据文件 source/_data/guide.yml —— 人工精选，推荐
#      每条只写 post: 文章 slug，标题/日期/分类/摘要/链接自动取；
#      也可以写 title / desc / link / category 完全手填，不依赖文章。
#   2. 没有数据文件时：按 category 过滤、按发布日期倒序自动取 count 条；
#   3. 一条都取不到 → 整块不输出（不会留空白，也不会报错）。
# ------------------------------------------------------------
guide_box:
  enable: true                      # 总开关
  title: "精选导读"                 # 板块标题
  icon: ""                          # 标题图标（Font Awesome 类名，如 fa-solid fa-book-open）；留空不显示
  count: 6                          # 条数；建议 3 或 6（三列刚好整行）
  category: []                      # 自动模式的分类过滤（分类名数组，空 = 全部分类）
  show_date: true                   # 显示日期
  show_desc: true                   # 显示摘要（两行截断；关闭后卡片只留标题）
  colors:                           # 分类胶囊配色，按条目顺序循环取色
    - "#1F2EFF"
    - "#7A5000"
    - "#8218C3"
    - "#AE0946"
    - "#106165"
    - "#02642E"

# ------------------------------------------------------------
# 首页设置 - 热门文章  Hot topics
# （inc/config.php 热门文章节）
# WP 中 hot_cat_id 为分类 ID、hot_post_ids 为文章数字 ID；
# Hexo 为静态站点，此处对应填写【分类名】与【文章文件名(slug)】。
# 标题 / 图标 / 调用条数 → 见文件末尾 sections.hot（title/icon/num）
# ------------------------------------------------------------
hot_cat_id: []                      # 文章分类 Category（multiple；填分类名数组）
hot_post_ids: ""                    # 文章ID列表 Article ID list（逗号分隔的文章 slug）

# ------------------------------------------------------------
# 首页设置 - 最新文章  Latest
# （inc/config.php 最新文章节；posts_ids/posts_not_in_ids 在 Hexo 中填分类名）
# ------------------------------------------------------------
posts_ids: []                       # 只显示这些分类下的文章（填分类名，空=全部）—— 在分页前过滤，页码与篇数不会错位
posts_not_in_ids: []                # 排除这些分类（填分类名）
posts_auto_load: "1"                # 自动加载：1 开 / 0 关（滚动到底自动追加下一页，会隐藏底部分页条）
posts_auto_load_limit: "1"          # 自动加载次数：再自动加载几页，0 = 一直加载到最后一页
full_width: false                   # 全宽 Full width（最新文章模块）
list_type: "0"                      # 布局 Layout（0 列表 List / 1 卡片 Card）
vt_columns: "3"                     # 每行列数 Number of rows and columns（2/3/4/5）

# ------------------------------------------------------------
# 首页设置 - 友情链接  Links
# （inc/config.php 友情链接节；links_switcher 对应 WP 链接管理开关）
# 标题 / 图标 → 见文件末尾 sections.links（title/icon）
# ------------------------------------------------------------
# 首页友情链接的第二个开关：与 sections.links.show 并联，任一为 false 都不显示。
# （老配置只认这一个，新配置用 sections 更直观；留着是为了不让老配置悄悄失效）
links_switcher: true                # Links 开关

# Hexo 静态站没有 WP 链接管理器（get_bookmarks），
# 友情链接数据转写为下方 links_data 数组（结构对应 link_url/link_name/
# link_description/link_image/link_target 字段），由 templates/home/links.php
# 与 page-links.php 的相同 DOM 结构输出。
links_data:
  # 原第一条「Mirage 主题演示」指向本站域名，属于模板示例数据，已移除
  - url: "https://hexo.io/"                  # link_url
    name: "Hexo 官网"                        # link_name
    description: "快速、简洁且高效的博客框架"    # link_description
    image: "/images/link.png"                # link_image
    target: "_blank"                         # link_target
# 新增友情链接按上面结构继续追加即可：
#  - url: "https://example.com/"
#    name: "Example"
#    description: ""
#    image: ""
#    target: "_blank"

# page-links.php 的链接分组（WP: get_categories(taxonomy=link_category)
# + get_bookmarks(category)）。每项 {name, links}，links 结构同 links_data。
links_groups: []
#  - name: "技术博客"
#    links:
#      - url: "https://example.com/"
#        name: "Example"
#        description: ""
#        image: ""
#        target: "_blank"

# ------------------------------------------------------------
# 友情链接页  Friend links（Butterfly flink 版式）
# 模板：layout/links.ejs        样式：source/style/links-page.css
# 数据：source/_data/<data>.yml（数据不放在主题里，换主题不用搬家）
#
# 触发方式：source/links/index.md 的 front-matter 必须是
#   layout: links
#
# 数据结构与 Butterfly 完全一致，照抄它的 link.yml 即可用：
#   - class_name: 分组名          # 渲染成 h2 标题，留空则不出标题
#     class_desc: 分组说明        # 可选，标题下面那行灰字
#     link_list:
#       - name:    站点名         # 必填
#         link:    https://...    # 必填
#         avatar:  头像地址       # 留空 / 加载失败 -> 用下面的 error_img
#         descr:   一句话描述     # 可选，卡片第二行
#
# 备注：安知鱼那套额外字段（siteshot / color / tag / flink_style /
# hundredSuffix / recommend）本模板不读取，留着不影响渲染，删掉也不影响。
# 上面 links_data / links_groups 那套是 WordPress 版遗留的扁平结构，
# 只有老布局 page-links.ejs 还在用；友链页已改用本节的 link.yml。
# ------------------------------------------------------------
flink:
  data: link                           # 数据文件名：source/_data/link.yml
  error_img: "/images/link.png"        # 头像没填或加载失败时的兜底图
  random: true                         # true 每次刷新打乱顺序（由 source/js/flink.js 执行）
  columns: 3                           # 一行放几个；窄屏自动降成 2 个 / 1 个

  # ---- 顶部 Banner（和朋友圈页同一种版式） ----
  banner: true                         # false 则整块不输出，页面回到纯标题
  banner_bg: "/images/minjian.webp"    # 背景图，建议 1200×400 以上的横图
  banner_tips: "以文会友，以友辅仁"    # 大标题上方的小字
  banner_btn: "去朋友圈"               # 右下角按钮文字
  banner_link: "/fcircle/"             # 按钮跳转地址
  banner_label: ""                     # 左下角文字；留空自动显示「共 N 个站点 · M 个分组」

# ------------------------------------------------------------
# 朋友圈 / 博友动态页  Friends circle
#
# 页面地址：/fcircle/（默认不进导航；要挂菜单，把 menu 里「朋友圈」那两行的注释去掉）
# 页面文件：source/fcircle/index.md，front-matter 必须是 layout: fcircle
# 模板 layout/fcircle.ejs ｜ 样式 source/style/fcircle-page.css ｜ 脚本 source/js/fcircle.js
#
# 数据从哪来：api_url 指向一个返回 fcircle.json 的接口，格式（hexo-circle-of-friends）：
#   { "stats": {friends, active, articles, updated},
#     "articles": [{title, link, author, avatar, date, description}] }
#   默认值是 quanzi.liublog.cn 这个公共池，收录的是接入该服务的博友，
#   不等于本站 link.yml 里的友链。想换成自己的数据，只改 api_url 一行，页面不用动。
#
# 参数一览（按顺序）：
#   enable            页面总开关，false 时只显示「已关闭」提示，不请求接口
#   tips / title      顶部小字 / 大标题
#   bottom_left       左下角文字
#   bottom_right      右下角按钮文字
#   bottom_right_link 按钮与「全部友链」的跳转地址
#   top_background    背景图
#   error_img         头像加载失败兜底图
#   api_url           数据接口
#   per_page          每次加载几张卡片
#   random            钓鱼块开关（随机抽一篇）
#   stats             统计条开关（博友 / 活跃 / 文章 / 最后更新）
# ------------------------------------------------------------
fcircle:
  enable: true                          # 页面总开关：false 时整页只显示提示，不发请求
  tips: "订阅友链最新文章"              # Banner 上方小字
  title: "朋友圈"                       # Banner 大标题
  bottom_left: "友链"                   # Banner 左下角文字（显示在按钮左侧）
  bottom_right: "友情链接"              # Banner 右下角按钮文字
  bottom_right_link: "/links/"          # 按钮与「全部友链」的跳转地址
  top_background: "/images/friend-circle.webp"   # Banner 背景图，建议 1200×400 以上的横图
  error_img: "/images/placeholder.svg"  # 头像没填或加载失败时的兜底图
  api_url: "https://quanzi.liublog.cn/" # 数据接口，末尾斜杠可省略
  per_page: 12                          # 一屏渲染几张卡片，「加载更多」每次追加这么多
  random: true                          # true 显示「钓鱼」块（随机抽一篇友链文章）
  stats: true                           # true 显示统计条；false 整条不输出

# ------------------------------------------------------------
# 装备页（商品推荐）Equipment
#
# 页面地址：/equipment/
# 页面文件：source/equipment/index.md，front-matter 必须是 layout: equipment
# 模板 layout/equipment.ejs ｜ 样式 source/style/equipment-page.css
# 数据 source/_data/equipment.yml
#
# 这个页面只放「商品」，卡片显示平台角标、价格、购买入口；
# 文章推荐请用 recommend 段（/recommend/），两边不要混放。
#
# 商品条目字段：
#   name / reason / tag / price / original_price / platform / image / link
#   详细说明见 source/_data/equipment.yml 开头
#
# 电商推广 ID 见下方 equipment.ecommerce，三个平台各一组。
#
# 参数一览：enable / data / columns / tips / title /
#           bottom_right / bottom_right_link / top_background / error_img /
#           link_text_web / link_text_post / ecommerce
# ------------------------------------------------------------
equipment:
  enable: true                          # 页面总开关：false 时整页只显示提示
  data: "equipment"                     # 数据文件 source/_data/<data>.yml
  columns: 4                            # 桌面端一行几张（窄屏自动降成 3 / 2 / 1）
  tips: "分享装备带来的乐趣"                      # Banner 上方小字
  title: "我的装备"                     # Banner 大标题
  bottom_right: "友情链接"              # Banner 右下角按钮文字
  bottom_right_link: "/links/"          # 按钮跳转地址
  top_background: "/images/friend-circle.webp"    # Banner 背景图，建议 1200×400 以上横图
  error_img: "/images/default-cover.webp"         # 封面图缺失或加载失败的兜底图
  link_text_web: "前往官网"             # 外链卡片的链接文字
  link_text_post: "查看文章"            # 站内卡片（指向文章）的链接文字

  # ----------------------------------------------------------
  # 电商推广 ID（淘宝客 / 京东联盟 / 多多进宝）
  #
  # 先说明一个前提：纯静态站没法实时转链。商品的推广链接仍然建议在
  # 联盟后台「转链」生成后，整条填进 equipment.yml 的 link 字段。
  # 这里记录账号 ID，作用有三：
  #   1. 换号 / 换推广位时只改这一处；
  #   2. 商品条目只写了平台商品 ID 时，拼出该平台的普通商品页（非推广）；
  #   3. 配合 disclosure 在卡片和页脚输出「推广链接」提示（广告合规）。
  #
  # 淘宝客：pub_id 形如 mm_123456789_1234567_123456789，adzone_id 是推广位
  # 京东联盟：union_id（联盟 ID）+ position_id（推广位 ID）
  # 多多进宝：pid 形如 1234567_123456789
  # ----------------------------------------------------------
  ecommerce:
    taobao_pid: ""                      # 淘宝客 pid
    taobao_adzone_id: ""                # 淘宝客推广位 adzone_id
    jd_union_id: ""                     # 京东联盟 union_id
    jd_position_id: ""                  # 京东联盟推广位
    pdd_pid: ""                         # 多多进宝 pid
    disclosure: true                    # 卡片角标 + 页脚「推广链接」声明
    # 角标文案：广告合规要求推广内容可识别，写「广告」最稳妥；
    # 留空则整条角标不输出（只在 disclosure 为 false 时才有意义）
    ad_text: "广告"

# ------------------------------------------------------------
# 即刻短文 / 说说页  Vignette
#
# 页面地址：/vignette/
# 页面文件：source/vignette/index.md，front-matter 必须是 layout: vignette
# 模板 layout/vignette.ejs ｜ 样式 source/style/vignette-page.css
# 数据 source/_data/vignette.yml
#
# 每条说说：title / date / author{name,avatar,link} / content / images[]
#   images 写 0、1、2、4 张都行；一屏显示 2 张，多出来的用左右按钮翻页。
#   字段说明见 source/_data/vignette.yml 开头。
#
# 点赞复用 zan 段：每条说说按「日期-标题」生成独立 key，
# 没开 zan（或填了 like: false）时心形只显示 0，不产生任何请求。
# ------------------------------------------------------------
vignette:
  enable: true                          # 页面总开关：false 时整页只显示提示
  title: "即刻短文"                     # 页面大标题
  tips: "随时随地，分享生活"            # 标题上方小字
  per_page: 8                           # 首屏显示几条，其余点「加载更多」
  avatar: "/images/avatar.jpg"          # 作者没填头像时的兜底图
  like: true                            # 显示心形（还需 zan.enable 才会真计数）

# ------------------------------------------------------------
# 推荐页  Recommend
#
# 页面地址：/recommend/（默认不进导航）
# 页面文件：source/recommend/index.md，front-matter 必须是 layout: recommend
# 模板 layout/recommend.ejs ｜ 样式 source/style/recommend-page.css
# 数据 source/_data/recommend.yml
#
# 由装备页复制而来，版式、参数、数据格式与 equipment 段完全一致，
# 只换了数据文件和文案：
#   推荐页 → 文章推荐（auto 自动取文，发新文章自动更新）
#   装备页 → 商品推荐（手写清单 + 电商推广链接）
# 参数含义见上方 equipment 段的注释，这里不再重复。
# ------------------------------------------------------------
recommend:
  enable: true                          # 页面总开关：false 时整页只显示提示
  data: "recommend"                     # 数据文件 source/_data/<data>.yml
