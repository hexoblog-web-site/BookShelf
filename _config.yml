# ------------------------------------------------------------
# 阅读次数  Post views
# （2026-10-31 新增。静态站没有数据库，「计数」和「读数字」都得走
#   第三方服务或自建接口，所以这里做成可切换的 provider。）
#
# 三处代码分工，改配置即可，不用动模板：
#   _config.yml（本节）          开关与各服务的地址/参数
#   scripts/post-views.js         构建时算好接口地址，塞进 data-* 属性
#   source/js/post-views.js       运行时请求数字、填进页面、失败按配置隐藏
#
# provider 可选：
#   static   —— 不联网，只显示文章 front-matter 里手写的 views（默认，等于关闭）
#   busuanzi —— 不蒜子，一行脚本，页面 PV 由它自己写进 span
#   vercount —— Vercount，脚本地址不同、接口同不蒜子，可迁移旧数据（推荐试水）
#   waline   —— Waline 评论服务自带的 /comment?type=count 计数接口
#   umami    —— Umami 自建版 API（云版不开放，必须自建）
#   custom   —— 任意自建接口，返回 JSON，按 json_path 取数字
#
# 只填当前 provider 对应的那一小节就行，其余留着不影响。
# ------------------------------------------------------------
post_views:
  enable: true                   # 总开关 On/Off（false = 不输出条目、不加载任何脚本，页面零外部请求）
  provider: "zan"                # 计数服务 static / busuanzi / vercount / waline / umami / zan / custom
  label: "次阅读"                # 数字后面的单位文案，留空则只显示数字
  hide_on_error: true            # 接口失败时整条隐藏（false = 失败也占位显示 0）
  min_display: 1                 # 少于这个数字就不显示，0 = 始终显示
  cache_minutes: 30              # 同一浏览器内的缓存分钟数，0 = 每次刷新都请求
  timeout_seconds: 12            # 等数字的上限秒数；不蒜子实测单是脚本就要 5~6 秒，别调太小

  # ---- 不蒜子（国内老牌，近一年常 503，能忍再用）----
  busuanzi:
    script: "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"
    id_prefix: "busuanzi"        # 脚本写入 #busuanzi_value_page_pv

  # ---- Vercount（不蒜子兼容接口，可把旧数据迁过去）----
  vercount:
    script: "https://events.vercount.one/js"
    id_prefix: "vercount"        # 脚本写入 #vercount_value_page_pv

  # ---- Waline 评论服务自带的计数（需先有 Waline 服务端）----
  waline:
    server_url: ""               # 例 https://comment.example.com（末尾不要斜杠）
    path_field: "pathname"       # pathname（站内相对路径）/ permalink（完整网址）

  # ---- Umami（仅自建版；把 Share 链接或 API 地址填进 endpoint）----
  # 例：https://umami.example.com/api/share/AbCdEf/stats?url={path}
  # 数字位置按实际返回改 json_path：Umami v2 的 pageviews 在 data.pageviews
  umami:
    endpoint: ""
    token: ""                    # 用 API Token 时填（以 Bearer 头发送）；Share 方式留空
    json_path: "data.pageviews"
    method: "GET"

  # ---- zan（本项目：阅读和点赞共用一个服务，一次请求又写又读）----
  # 打开文章页就上报一次，所以 cache_minutes 会自动置 0，填了也不生效。
  # 跨域白名单里要加上博客域名，否则浏览器会拦掉 POST。
  zan:
    server: "https://zan.liublog.cn"   # 服务地址，末尾不要带斜杠

  # ---- 自建接口（任何返回 JSON 的计数服务）----
  # url 里的 {path} 会被替换成当前页路径（已 URL 编码）
  custom:
    url: ""                      # 例 https://api.example.com/views?path={path}
    token: ""
    json_path: "data.count"      # 例 data.count / 0.pv（数组下标直接写数字）
    method: "GET"                # GET / POST（POST 时把 { path } 放进 JSON body）

